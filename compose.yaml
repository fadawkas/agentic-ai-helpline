services:
  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      VITE_API_BASE_URL: /api
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      target: development
    environment:
      APP_NAME: ${APP_NAME:-voice-support}
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-true}
      POSTGRES_HOST: postgresql
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-voice_support}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-voice_support}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      TELEPHONY_ENABLED: ${TELEPHONY_ENABLED:-false}
      ASTERISK_ARI_URL: ${ASTERISK_ARI_URL:-http://asterisk:8088/ari}
      ASTERISK_ARI_USERNAME: ${ASTERISK_ARI_USERNAME:-voice_support}
      ASTERISK_ARI_PASSWORD: ${ASTERISK_ARI_PASSWORD:-}
      ASTERISK_ARI_APP: ${ASTERISK_ARI_APP:-voice-support}
      ASTERISK_AI_EXTENSION: ${ASTERISK_AI_EXTENSION:-7000}
      ASTERISK_MEDIA_WEBSOCKET_CLIENT: ${ASTERISK_MEDIA_WEBSOCKET_CLIENT:-voice_support_media}
      ASTERISK_MEDIA_FORMAT: ${ASTERISK_MEDIA_FORMAT:-slin16}
      VOICE_SAMPLE_RATE: ${VOICE_SAMPLE_RATE:-16000}
      VOICE_AGENT_ENABLED: ${VOICE_AGENT_ENABLED:-false}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      STT_MODEL: ${STT_MODEL:-nova-3}
      STT_LANGUAGE: ${STT_LANGUAGE:-id}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      LLM_CONVERSATION_MODEL: ${LLM_CONVERSATION_MODEL:-deepseek/deepseek-v4.1-flash-1017}
      LLM_CLASSIFIER_MODEL: ${LLM_CLASSIFIER_MODEL:-deepseek/deepseek-v4.1-flash-1017}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-1000}
      CONVERSATION_CONTEXT_MAX_TURNS: ${CONVERSATION_CONTEXT_MAX_TURNS:-30}
      JEV_INITIAL_PERSONALITY: ${JEV_INITIAL_PERSONALITY:-NEUTRAL}
      JEV_CLASSIFICATION_WARMUP_TURNS: ${JEV_CLASSIFICATION_WARMUP_TURNS:-3}
      JEV_CONFIDENCE_THRESHOLD: ${JEV_CONFIDENCE_THRESHOLD:-0.80}
      JEV_SWITCH_STABILITY_TURNS: ${JEV_SWITCH_STABILITY_TURNS:-2}
      FISH_AUDIO_API_KEY: ${FISH_AUDIO_API_KEY:-}
      FISH_TTS_MODEL: ${FISH_TTS_MODEL:-s2.1-pro-free}
      FISH_REFERENCE_ID: ${FISH_REFERENCE_ID:-}
      FISH_TTS_LANGUAGE: ${FISH_TTS_LANGUAGE:-id}
      FISH_TTS_LATENCY: ${FISH_TTS_LATENCY:-balanced}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-intfloat/multilingual-e5-large}
      RAG_EMBEDDING_DIMENSIONS: ${RAG_EMBEDDING_DIMENSIONS:-1024}
      RAG_COLLECTION_NAME: ${RAG_COLLECTION_NAME:-voice_support_knowledge_v1}
      RAG_MIN_SIMILARITY: ${RAG_MIN_SIMILARITY:-0.45}
      RAG_MAX_RESULTS: ${RAG_MAX_RESULTS:-4}
      RAG_QUERY_REWRITE_ENABLED: ${RAG_QUERY_REWRITE_ENABLED:-true}
      RAG_RERANK_MIN_SCORE: ${RAG_RERANK_MIN_SCORE:-0.4}
      RAG_RERANK_MODEL: ${RAG_RERANK_MODEL:-cohere/rerank-4-fast}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-}
      KNOWLEDGE_STORAGE_PATH: /app/knowledge/uploads
      KNOWLEDGE_MAX_UPLOAD_BYTES: ${KNOWLEDGE_MAX_UPLOAD_BYTES:-20000000}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - knowledge_documents:/app/knowledge/uploads
    depends_on:
      postgresql:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  ragas-evaluator:
    profiles: ["evaluation"]
    build:
      context: ./backend
      target: evaluation
    environment:
      POSTGRES_PASSWORD: evaluation-not-used
      ASTERISK_ARI_USERNAME: evaluation-not-used
      ASTERISK_ARI_PASSWORD: evaluation-not-used
      QDRANT_URL: http://qdrant:6333
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes:
      - ./backend:/app
    depends_on:
      qdrant:
        condition: service_healthy

  postgresql:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-voice_support}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DATABASE:-voice_support}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  qdrant:
    image: qdrant/qdrant:v1.15.4
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  asterisk:
    profiles: ["telephony"]
    build:
      context: ./infrastructure/asterisk
    environment:
      ASTERISK_SIP_PORT: ${ASTERISK_SIP_PORT:-5060}
      ASTERISK_RTP_START: ${ASTERISK_RTP_START:-10000}
      ASTERISK_RTP_END: ${ASTERISK_RTP_END:-10100}
      ASTERISK_LOCAL_NETWORK: ${ASTERISK_LOCAL_NETWORK:-192.168.1.0/24}
      ASTERISK_EXTERNAL_ADDRESS: ${ASTERISK_EXTERNAL_ADDRESS:-}
      ASTERISK_SIP_USERNAME: ${ASTERISK_SIP_USERNAME:-1001}
      ASTERISK_SIP_PASSWORD: ${ASTERISK_SIP_PASSWORD:-}
      ASTERISK_AI_EXTENSION: ${ASTERISK_AI_EXTENSION:-7000}
      ASTERISK_ARI_USERNAME: ${ASTERISK_ARI_USERNAME:-voice_support}
      ASTERISK_ARI_PASSWORD: ${ASTERISK_ARI_PASSWORD:-}
      ASTERISK_ARI_APP: ${ASTERISK_ARI_APP:-voice-support}
      ASTERISK_MEDIA_WEBSOCKET_CLIENT: ${ASTERISK_MEDIA_WEBSOCKET_CLIENT:-voice_support_media}
    ports:
      - "${ASTERISK_SIP_PORT:-5060}:${ASTERISK_SIP_PORT:-5060}/udp"
      - "${ASTERISK_RTP_START:-10000}-${ASTERISK_RTP_END:-10100}:${ASTERISK_RTP_START:-10000}-${ASTERISK_RTP_END:-10100}/udp"
    volumes:
      - asterisk_data:/var/lib/asterisk
    healthcheck:
      test: ["CMD-SHELL", "asterisk -rx 'core show uptime' >/dev/null 2>&1 && asterisk -rx 'pjsip show endpoint 1001' | grep -q 'Endpoint:  1001'"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  frontend_node_modules:
  postgres_data:
  qdrant_data:
  asterisk_data:
  knowledge_documents:
  # Retain the prior MongoDB volume for manual inspection/export; no service mounts it.
  mongodb_data:
