[modules]
autoload=yes

; Configuration comes from files, not LDAP or PostgreSQL RealTime.
noload = res_config_ldap.so
noload = res_config_pgsql.so

; Audio uses SIP/WebSocket transports, not container sound devices.
noload = chan_alsa.so
noload = chan_console.so
noload = chan_oss.so

; No call-record/event database or custom-file destinations are configured.
noload = cdr_pgsql.so
noload = cdr_custom.so
noload = cdr_sqlite3_custom.so
noload = cel_pgsql.so
noload = cel_custom.so
noload = cel_sqlite3_custom.so

; The pinned image lacks the optional Vorbis encoder library.
noload = format_ogg_vorbis.so

; Preserve the base image's disabled HEP capture modules.
noload = res_hep.so
noload = res_hep_pjsip.so
noload = res_hep_rtcp.so
