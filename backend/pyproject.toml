[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-support-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "asyncpg>=0.30,<1",
  "bcrypt>=4.2,<6",
  "python-multipart>=0.0.20,<1",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "pillow>=11,<13",
  "pipecat-ai[deepgram,fish,openai,silero]==1.8.1",
  "pipecat-asterisk==0.1.4",
  "pydantic-settings>=2.7,<3",
  "qdrant-client>=1.15,<1.17",
  "uvicorn>=0.34,<1",
  "websockets>=15,<18",
  "onnxruntime>=1.20,<2",
  "soxr~=1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2"]
evaluation = [
  "ragas==0.4.3",
  "langchain<1",
  "langchain-community<0.4",
  "langchain-core<1",
  "langchain-openai<1",
]
